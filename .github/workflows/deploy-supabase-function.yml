name: Deploy Supabase admin function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/admin-users/**"
      - ".github/workflows/deploy-supabase-function.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy admin-users function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi
          supabase link --project-ref bvrehgyjxbwlrcbdxdos
          supabase functions deploy admin-users --project-ref bvrehgyjxbwlrcbdxdos --yes
